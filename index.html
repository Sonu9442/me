<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dhurma Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: #0f172a; }
    .nav-bar {
      display: flex;
      background: #1e293b;
      padding: 8px 12px;
      gap: 10px;
      border-bottom: 1px solid #334155;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: #334155;
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .tab-btn.active {
      background: #2563eb;
      color: #ffffff;
    }
    iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <div class="nav-bar">
    <button class="tab-btn active" onclick="openPage('iqama.html', this)">📋 Iqama Dashboard</button>
    <button class="tab-btn" onclick="openPage('manpower.html', this)">👷 152-154 Manpower</button>
  </div>

  <iframe id="viewer" src="iqama.html"></iframe>

  <script>
    function openPage(file, btn) {
      document.getElementById('viewer').src = file;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>

</body>
</html>
